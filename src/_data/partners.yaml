intro: "ECO-BRIDGE KAWEMPE does not work alone. Every program in our Work Plan runs through a named partnership, listed here exactly as it appears in that document."
list:
  - name: "KCCA Community Development Office"
    role: "CBO registration, oversight, and linkages with city programmes in Kawempe Division."
  - name: "LC1 and LC2 Local Council leaders"
    role: "Community mobilisation, recommendation letters, and joint implementation of activities."
  - name: "Schools in target areas"
    role: "Environmental education, school clubs, tree planting, and health outreach."
  - name: "National Environment Management Authority (NEMA)"
    role: "Technical guidance on environmental standards and compliance."
  - name: "Community households"
    role: "Direct beneficiaries and volunteers in clean-up drives, tree planting, and trainings."
