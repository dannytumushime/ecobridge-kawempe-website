brand_name: ECO-BRIDGE
legal_name: ECO-BRIDGE KAWEMPE
tagline: Bridging Communities to Environmental Solutions
org_type: Community-Based Organization
registration_authority: "Kampala Capital City Authority (KCCA), Kawempe Division Community Development Office"
registration_status: "Application submitted, review in progress"
registration_status_short: In progress
name_history: "ECO-BRIDGE AFRICA (founded Jan 2025) → ECO-BRIDGE (renamed Feb 2026, on KCCA's advice) → ECO-BRIDGE KAWEMPE (current, Mar 2026)"
founded_date: "11 January 2025"
founding_members_count: 8
current_membership_count: 21
membership_note: "as of 1 March 2026, exceeding KCCA's 20-member CBO threshold"
registered_office: "University Hall, Makerere University, Kampala, Uganda"
area_of_operation: Kawempe Division, Kampala
governed_by: "Constitution of the Republic of Uganda, 1995 (as amended); NGO Act, 2016; NGO Regulations, 2017"
email: ecobridge@gmail.com

vision: "To see communities living in a clean, healthy, and sustainable environment, where youth and women are empowered to take leadership in environmental conservation and community development."
mission: "To empower communities, particularly youth and women, through environmental conservation, health promotion, skills development, and civic engagement, in order to build cleaner, healthier, and more resilient communities."

core_values:
  - "Environmental stewardship and care for the community"
  - "Integrity, honesty, and transparency in all activities"
  - "Inclusivity and equal opportunity for all members and beneficiaries"
  - "Community participation and ownership"
  - "Accountability to members, beneficiaries, and partners"
  - "Respect for human rights and dignity"

our_story:
  - "ECO-BRIDGE KAWEMPE began on 11 January 2025, when eight founding members met in Kampala out of a shared concern for environmental degradation, poor sanitation, and limited youth opportunity."
  - "Over the following year, the group ran pilot activities across Kampala: school outreach, waste segregation campaigns, tree planting, and air quality awareness sessions. That experience is documented in full on our Our Work page."
  - "On 23 August 2025, members adopted the organization's Vision, Mission, Core Values, and Strategic Plan after months of drafting against Uganda's NGO Act, 2016 and NGO Regulations, 2017."
  - "In February 2026, on the advice of the KCCA Bwaise Community Development Officer, the organization renamed itself from ECO-BRIDGE AFRICA to ECO-BRIDGE, since a Community-Based Organization's name must match its actual geographic scope of operation."
  - "By 1 March 2026, membership had grown to 21 registered members, past KCCA's 20-member threshold for CBO registration. Members elected a seven-seat Executive Committee and confirmed the current registration name, ECO-BRIDGE KAWEMPE, anchored to Kawempe Division, where the organization's work is concentrated."

executive_committee:
