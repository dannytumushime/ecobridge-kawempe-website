    name: Tumushime Daniel
    published: true
    responsibilities: "Provides overall leadership and direction, presides over General and Executive Committee meetings, represents the organization to government and partners, and is a principal signatory to the bank accounts."
  - role: Secretary
    name: Namwanga Maria Assumpta
    published: true
    responsibilities: "Keeps all records, minutes, and correspondence, issues meeting notices, maintains the register of members, and prepares reports to KCCA and other authorities."
  - role: Treasurer
    name: Asobola Elizabeth
    published: true
    responsibilities: "Receives, records, and safeguards all funds, prepares financial reports, maintains the books of accounts, and is a principal signatory to the bank accounts."
  - role: Vice-Chairperson
    name: ""
    published: false
    responsibilities: "Assists the Chairperson and assumes the Chairperson's duties in their absence."
  - role: "Committee Member: Environment & Climate Action"
    name: ""
    published: false
    responsibilities: "Leads planning and implementation of activities under Objective 1: environmental conservation, waste management, and pollution reduction."
  - role: "Committee Member: Health, Education & Community Development"
    name: ""
    published: false
    responsibilities: "Leads planning and implementation of activities under Objectives 2 and 4: WASH promotion, health awareness, and environmental literacy."
  - role: "Committee Member: Livelihoods & Economic Empowerment"
    name: ""
    published: false
    responsibilities: "Leads planning and implementation of activities under Objective 3: composting, plastic upcycling, and other income-generating projects."

governance_structure:
  - body: "The General Assembly"
    description: "All Ordinary Members in good standing. The supreme decision-making body: adopts and amends the Constitution, elects and removes the Executive Committee, and approves reports, budgets, and dissolution."
  - body: "The Executive Committee"
    description: "Seven elected members serving three-year terms. The executive and management body, meeting at least monthly."
  - body: "Sub-committees"
    description: "Established from time to time by the Executive Committee, including the Project Management Committee and Procurement Sub-Committee named in our Work Plan."

membership:
  eligibility: "Open to any Ugandan citizen aged 18 or older who subscribes to the organization's objectives and agrees to abide by the Constitution."
  categories:
    - name: Ordinary Members
      description: "Full membership rights, including the right to vote and to be elected to office."
      fee: "UGX 25,000 one-time registration, UGX 50,000 annual subscription"
    - name: Associate Members
      description: "Organizations or institutions admitted to support the organization, with observer status only."
      fee: "UGX 100,000 annual subscription"
    - name: Honorary Members
      description: "Distinguished individuals recognised by the General Assembly for outstanding contribution."
      fee: "Exempt from all fees"
  how_to_apply: "Applications are submitted in writing to the Secretary and considered by the Executive Committee within 30 days of receipt."

financial:
  bank_signatories: "Any two (2) of Chairperson, Treasurer, or Secretary, as set out in Article 24 of our Constitution"
  financial_year: "1 January to 31 December"
  audit: "Annual independent audit, presented to the General Assembly at the AGM (Article 26)"
  use_of_funds: "No income or asset may be distributed to any member or official (Article 25). The Organization operates strictly on a non-profit basis."

